services:
  kafka:
    image: apache/kafka:4.0.0
    container_name: kafka
    ports:
      - "9092:9092"   # Python scripts on your computer connect here (localhost:9092)
    environment:
      # --- Identity: this one container is both broker and controller (KRaft mode, no Zookeeper) ---
      CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      # --- Listeners: the "doors" Kafka opens ---
      # PLAINTEXT       -> for other containers (e.g. a consumer running in Docker), at kafka:29092
      # PLAINTEXT_HOST  -> for your computer, at localhost:9092
      # CONTROLLER      -> internal cluster management
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      # --- Single broker, so internal topics can only have 1 copy ---
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      # --- Convenience settings for local development ---
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
    restart: unless-stopped   # Docker restarts it automatically if it crashes

  postgres:
    image: postgres:16
    container_name: postgres
    ports:
      - "5433:5432"   # host port 5433 avoids clashing with a local PostgreSQL on 5432
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Used only by the first-start script that creates Grafana's read-only user
      GRAFANA_DB_USER: ${GRAFANA_DB_USER:-grafana_reader}
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data          # keeps your data when the container restarts
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro   # runs once, on first start
      - ./sql/002_alerts.sql:/docker-entrypoint-initdb.d/02_alerts.sql:ro
      - ./sql/003_grafana_reader.sh:/docker-entrypoint-initdb.d/03_grafana_reader.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped   # Docker restarts it automatically if it crashes
  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.5.0
    container_name: kafka-ui
    ports:
      - "8080:8080"   # open http://localhost:8080
    environment:
      KAFKA_CLUSTERS_0_NAME: heartbeat-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092   # Kafka's door for OTHER CONTAINERS (not localhost:9092)
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped   # Docker restarts it automatically if it crashes
  mailpit:
    image: axllent/mailpit:v1.20.0
    container_name: mailpit
    ports:
      - "1025:1025"   # SMTP: the alert service sends emails here
      - "8025:8025"   # web inbox: open http://localhost:8025 to read them
    restart: unless-stopped   # Docker restarts it automatically if it crashes
  grafana:
    image: grafana/grafana:11.4.0
    container_name: grafana
    ports:
      - "3000:3000"   # open http://localhost:3000
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/heartbeat-monitoring.json
      # Read-only database login for the dashboard (see grafana/provisioning/datasources)
      GRAFANA_DB_USER: ${GRAFANA_DB_USER}
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - grafana_data:/var/lib/grafana                          # keeps Grafana settings between restarts
      - ./grafana/provisioning:/etc/grafana/provisioning:ro    # datasource + dashboard loading
      - ./grafana/dashboards:/etc/grafana/dashboards:ro        # the dashboard itself
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped   # Docker restarts it automatically if it crashes

volumes:
  pgdata:
  grafana_data: